<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{% if article %}編輯投稿{% else %}新增投稿{% endif %}</title>
</head>
<body>
    <h2>{% if article %}編輯投稿{% else %}新增投稿{% endif %}</h2>

    <form action="{{ action }}" method="post">
        <label>類別：</label><br>
        <input type="text" name="category" value="{{ article.category if article else '' }}" required><br><br>

        <label>標題：</label><br>
        <input type="text" name="title" value="{{ article.title if article else '' }}" required><br><br>

        <label>文章內容：</label><br>
        <textarea name="content" rows="10" cols="50" required>{{ article.content if article else '' }}</textarea><br><br>

        <button type="submit">儲存</button>
    </form>

    <a href="/author/{{ user.id }}">返回作者首頁</a>
</body>
</html>
