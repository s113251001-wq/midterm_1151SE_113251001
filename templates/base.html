<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>投稿審查系統</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">投稿審查系統</div>
        <div class="nav-links">
            {% if request.session.get('username') %}
                <span>歡迎，{{ request.session.get('username') }} ({{ request.session.get('role') }})</span>
                <a href="/logout" class="btn-logout">登出</a>
            {% endif %}
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
