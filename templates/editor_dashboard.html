{% extends "base.html" %}

{% block content %}
<h2>待審查稿件清單</h2>

<table class="data-table">
    <thead>
        <tr>
            <th>作者</th>
            <th>類別</th>
            <th>標題</th>
            <th>送出時間</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for sub in submissions %}
        <tr>
            <td>{{ sub["author_name"] }}</td>
            <td>{{ sub["category"] }}</td>
            <td>{{ sub["title"] }}</td>
            <td>{{ sub["updated_at"].strftime('%Y-%m-%d %H:%M') }}</td>
            <td>
                <a href="/editor/detail/{{ sub['id'] }}" class="btn-link">查看內容 / 審查</a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5" style="text-align: center; color: #666;">目前沒有待審查的稿件。</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
